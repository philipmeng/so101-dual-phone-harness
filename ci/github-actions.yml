name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install control dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-control.txt
          python -m pip install --no-deps lerobot==0.6.1
      - name: Run offline regression tests
        run: PYTHONPATH=harness python -m unittest discover -s tests -v
      - name: Check command-line entry points
        run: |
          python harness/phone_control.py --help
          python harness/phone_input_preview.py --help
          python harness/dual_dashboard.py --help
          python tools/check_arm.py --help
          python -c "from lerobot.motors.feetech import FeetechMotorsBus; from lerobot.motors import MotorCalibration"
